name: site
# The portfolio site's multi-platform check (AGENTS.md executionIsCheap): every push builds the synthetic fixture
# instance and sweeps each page in two passes (scripts/site-sweep.mjs). The first renders the nine fixed viewports of
# src/render/viewports.mjs (320x568 to 1920x1080) with a capture each and fails on horizontal overflow, a key element
# below its data-min-size, a fallback font or a broken image. The second checks every width from 320 to 1920 px in
# 1 px steps at heights 568, 800 and 1080, without captures, for overflow and key elements below their minimum size.
# It runs on push only, with no schedule and no path filter, since a change outside site/ (a catalog label, a ranking
# rule, a token) can move the output.
on:
  push:
permissions:
  contents: read
jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FSW_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v6
      - name: Write the fixture instance
        run: node -e "import('./test/fixtures/site-instance.mjs').then((m) => m.writeSiteFixture(process.argv[1]))" "$RUNNER_TEMP/site-instance"
      - name: Build the site
        run: node site/build.mjs --instance "$RUNNER_TEMP/site-instance" --out "$RUNNER_TEMP/site-dist"
      - name: Sweep every page at nine viewports and every width
        run: node scripts/site-sweep.mjs --dist "$RUNNER_TEMP/site-dist" --out "$RUNNER_TEMP/site-sweep"
      - name: Keep the captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-sweep
          path: ${{ runner.temp }}/site-sweep
          if-no-files-found: ignore

